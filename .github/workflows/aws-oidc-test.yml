name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::921810470521:role/ztd-capstone-ci
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify ECR access
        run: |
          aws ecr describe-repositories \
            --repository-names \
              ztd-capstone/frontend \
              ztd-capstone/api-gateway \
              ztd-capstone/orders \
              ztd-capstone/catalog \
            --region ap-south-1
