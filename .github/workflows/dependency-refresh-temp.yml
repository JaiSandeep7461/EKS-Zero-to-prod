name: dependency-refresh-temp

on:
  push:
    branches:
      - fix/align-ci-with-aks

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[dependency-refresh]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Refresh API gateway security dependencies
        working-directory: services/api-gateway
        run: |
          npm install --save \
            fastify@5.12.8 \
            @fastify/sensible@6.0.7 \
            @grpc/grpc-js@1.14.7 \
            @opentelemetry/propagator-jaeger@2.11.0 \
            fast-uri@3.1.9 \
            find-my-way@9.10.0 \
            proxy-addr@2.0.8

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'

      - name: Refresh catalog security dependencies
        working-directory: services/catalog
        run: |
          go get golang.org/x/net@v0.62.0 golang.org/x/text@v0.41.0 google.golang.org/grpc@v1.83.2
          go mod tidy

      - name: Verify dependency updates
        working-directory: services/api-gateway
        run: |
          npm run lint
          npm run build
          npm test

      - name: Verify catalog
        working-directory: services/catalog
        run: |
          go vet ./...
          go build ./...
          go test ./... -v

      - name: Commit generated dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api-gateway/package.json services/api-gateway/package-lock.json services/catalog/go.mod services/catalog/go.sum
          if git diff --cached --quiet; then
            echo "No dependency changes generated"
            exit 0
          fi
          git commit -m "fix(deps): refresh security-fixed dependencies [dependency-refresh]"
          git push origin HEAD:fix/align-ci-with-aks
