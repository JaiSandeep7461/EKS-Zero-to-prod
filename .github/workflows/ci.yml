name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Test frontend
        working-directory: services/frontend
        run: |
          npm ci
          npm run build
          npm test

      - name: Test API gateway
        working-directory: services/api-gateway
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: services/catalog/go.sum

      - name: Test catalog
        working-directory: services/catalog
        run: |
          go vet ./...
          go build ./...
          go test ./... -v

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test orders
        working-directory: services/orders
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          pytest -q

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, api-gateway, orders, catalog]
    steps:
      - uses: actions/checkout@v5

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ECR repositories use immutable tags. A previous run may already have
      # pushed this commit tag before a later SBOM/signing step failed.
      # Distinguish a genuinely missing image from an ECR/API failure so an
      # AWS outage cannot be silently treated as "image does not exist".
      - name: Check whether this tag is already pushed
        id: exists
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set +e
          error_file="$(mktemp)"
          aws ecr describe-images \
            --repository-name "ztd-capstone/${SERVICE}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --region "${AWS_REGION}" >/dev/null 2>"${error_file}"
          status=$?
          if [ "${status}" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "ImageNotFoundException" "${error_file}"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "ECR image lookup failed:"
            cat "${error_file}"
            exit "${status}"
          fi
          rm -f "${error_file}"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Reuse an already-pushed immutable image so retries still perform the
      # security scan, SBOM generation, and keyless signing/attestation.
      - name: Pull existing image for verification
        if: steps.exists.outputs.exists == 'true'
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          image="${ECR_REGISTRY}/ztd-capstone/${SERVICE}:${IMAGE_TAG}"
          docker pull "${image}"
          docker tag "${image}" "local/${SERVICE}:scan"
          docker image inspect "local/${SERVICE}:scan" >/dev/null

      - name: Build image
        if: steps.exists.outputs.exists != 'true'
        run: docker build -t "local/${{ matrix.service }}:scan" "services/${{ matrix.service }}"

      # GATE: table format (not sarif). This blocks only non-ignored
      # HIGH/CRITICAL vulnerabilities and keeps the existing security gate.
      - name: Trivy image scan (blocking on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'
          trivyignores: .trivyignore
          format: table

      - name: Tag + push to ECR
        if: steps.exists.outputs.exists != 'true'
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          image="${ECR_REGISTRY}/ztd-capstone/${SERVICE}:${IMAGE_TAG}"
          docker tag "local/${SERVICE}:scan" "${image}"
          docker push "${image}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate SBOM (SPDX)
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/out aquasec/trivy:latest image \
            --format spdx-json -o /out/sbom-${SERVICE}.spdx.json \
            "local/${SERVICE}:scan"

      - name: Cosign keyless sign + attest SBOM
        env:
          COSIGN_YES: 'true'
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          image="${ECR_REGISTRY}/ztd-capstone/${SERVICE}:${IMAGE_TAG}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}")"
          cosign sign --yes "${digest}"
          cosign attest --yes --predicate "sbom-${SERVICE}.spdx.json" --type spdxjson "${digest}"

  # GitOps deploy (Phase 8): CI does not touch the cluster. It bumps the
  # immutable image tag in Git and ArgoCD deploys it to the dev Application.
  bump-image-tag:
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Bump image.tag in values-dev.yaml
        run: |
          sed -i '0,/^  tag:/{s/^  tag:.*/  tag: ${{ steps.tag.outputs.tag }}/}' \
            deploy/helm/ztd-capstone/values-dev.yaml
          grep -n "tag:" deploy/helm/ztd-capstone/values-dev.yaml | head -1

      # [skip ci] prevents the GitOps bump commit from triggering this CI again.
      - name: Commit + push (ArgoCD dev Application auto-syncs from this)
        run: |
          git config user.name "SaiPisey2"
          git config user.email "piseysai0202@gmail.com"
          git add deploy/helm/ztd-capstone/values-dev.yaml
          if git diff --cached --quiet; then
            echo "No image.tag change to commit (tag already at ${{ steps.tag.outputs.tag }})"
            exit 0
          fi
          git commit -m "chore(dev): bump image.tag to ${{ steps.tag.outputs.tag }} [skip ci]"
          git push origin HEAD:main
